<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>nu.</title>
  <style>
    :root {
      --bg: #121212;
      --text: #F5F5F5;
      --muted: #8E8E93;
      --placeholder: #48484A;
      --input-placeholder: #6E6E73;
      --separator: #2C2C2E;
      --surface: #1A1A1A;
      --surface-border: #2C2C2E;
      --accent: #FF453A;
      --accent2: #FF453A;
      --marker: #FF453A;
      --emoji-idle-opacity: 0.7;
      --emoji-hover: rgba(255, 255, 255, 0.07);
      --emoji-selected: rgba(255, 255, 255, 0.11);
      --toggle-bg: rgba(255, 255, 255, 0.06);
      --font-override: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    [data-theme="light"],
    [data-theme="snow"] {
      --bg: #F2F2F7;
      --text: #1C1C1E;
      --muted: #6C6C70;
      --placeholder: #AEAEB2;
      --input-placeholder: #86868B;
      --separator: #D1D1D6;
      --surface: #FFFFFF;
      --surface-border: #E5E5EA;
      --accent: #FF3B30;
      --accent2: #FF3B30;
      --marker: #FF3B30;
      --emoji-idle-opacity: 0.35;
      --emoji-hover: rgba(0, 0, 0, 0.05);
      --emoji-selected: rgba(0, 0, 0, 0.09);
      --toggle-bg: rgba(0, 0, 0, 0.05);
      --font-override: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    [data-theme="cyberpunk"] {
      --bg: #0D0221;
      --text: #F5F0FF;
      --muted: #9D7FC9;
      --placeholder: #4A2E7A;
      --input-placeholder: #7457A8;
      --separator: #2E1155;
      --surface: #150633;
      --surface-border: #2E1155;
      --accent: #FF2ED1;
      --accent2: #00F0FF;
      --emoji-hover: rgba(255, 46, 209, 0.1);
      --emoji-selected: rgba(0, 240, 255, 0.15);
      --toggle-bg: rgba(255, 46, 209, 0.08);
      --font-override: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    [data-theme="neon"] {
      --bg: #0A0A0A;
      --text: #EFFFEF;
      --muted: #5FBF6B;
      --placeholder: #1F4023;
      --input-placeholder: #3A7541;
      --separator: #1A2E1C;
      --surface: #101410;
      --surface-border: #1A2E1C;
      --accent: #FF10F0;
      --accent2: #39FF14;
      --emoji-hover: rgba(57, 255, 20, 0.08);
      --emoji-selected: rgba(255, 16, 240, 0.15);
      --toggle-bg: rgba(57, 255, 20, 0.07);
      --font-override: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    [data-theme="christmas"] {
      --bg: #0F2A1D;
      --text: #F4EBD9;
      --muted: #9DB8A3;
      --placeholder: #6F9479;
      --input-placeholder: #6F9479;
      --separator: #24452F;
      --surface: #133222;
      --surface-border: #24452F;
      --accent: #E63946;
      --accent2: #E63946;
      --emoji-hover: rgba(244, 235, 217, 0.06);
      --emoji-selected: #163626;
      --toggle-bg: #163626;
      --font-override: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    [data-theme="deepblue"] {
      --bg: #0A1128;
      --text: #E8ECFB;
      --muted: #7C8DBF;
      --placeholder: #2B3868;
      --input-placeholder: #5866A0;
      --separator: #1B274D;
      --surface: #101A3A;
      --surface-border: #1B274D;
      --accent: #4361EE;
      --accent2: #4CC9F0;
      --emoji-hover: rgba(67, 97, 238, 0.12);
      --emoji-selected: rgba(76, 201, 240, 0.15);
      --toggle-bg: rgba(67, 97, 238, 0.08);
      --font-override: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    [data-theme="paper"] {
      --bg: #F5EFE4;
      --text: #2B2420;
      --muted: #8A7A68;
      --placeholder: #A8988A;
      --input-placeholder: #A8988A;
      --separator: #DDD2C2;
      --surface: #FBF7F0;
      --surface-border: #DDD2C2;
      --accent: #FF3B30;
      --accent2: #FF3B30;
      --marker: #FF3B30;
      --emoji-idle-opacity: 0.35;
      --emoji-hover: rgba(43, 36, 32, 0.05);
      --emoji-selected: #E3D8C6;
      --toggle-bg: #EBE3D5;
      --font-override: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    /* Paper popups: warm card instead of the page background */
    [data-theme="paper"] .modal,
    [data-theme="paper"] .emoji-panel {
      background: #FBF7F0;
      border-color: #DDD2C2;
    }
    [data-theme="paper"] .modal { box-shadow: 0 16px 48px rgba(43,36,32,0.14); }
    [data-theme="paper"] .emoji-panel { box-shadow: 0 8px 24px rgba(43,36,32,0.12); }
    [data-theme="paper"] .more-btn.open { background: #EBE3D5; }
    [data-theme="paper"] .cal-day:disabled { color: #C9BCAB; opacity: 1; }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      height: 100%;
    }

    body {
      min-height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-override);
      display: flex;
      justify-content: center;
      transition: background-color 0.25s ease, color 0.25s ease;
      -webkit-font-smoothing: antialiased;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── Top-right button row ── */
    .theme-toggle,
    .history-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 16px);
      z-index: 100;
      background: var(--toggle-bg);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: background 0.2s, color 0.2s;
    }

    .theme-toggle { right: 24px; }
    .history-btn { right: 68px; }

    .theme-toggle:hover,
    .history-btn:hover {
      background: var(--emoji-selected);
      color: var(--text);
    }

    .theme-toggle svg,
    .history-btn svg,
    .premium-btn svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    /* ── Main container ── */
    .container {
      width: 100%;
      max-width: 450px;
      padding: 66px 28px 60px; /* top: clear of the fixed header buttons */
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Header ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 28px;
    }

    .day-block {
      position: relative;
      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    .day-text {
      font-size: 60px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2.5px;
      color: var(--text);
    }

    .day-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background-color: var(--accent2);
      flex-shrink: 0;
      margin-bottom: 6px;
    }

    .date-block {
      text-align: right;
      color: var(--muted);
      line-height: 1.45;
      font-weight: 400;
      padding-top: 8px;
    }

    .date-month {
      font-size: 13px;
      display: block;
    }

    .date-clock {
      font-size: 26px;
      font-weight: 300;
      letter-spacing: -0.5px;
      display: block;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    }

    /* ── Input area ── */
    .input-section {
      margin-bottom: 4px;
    }

    textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-size: 21px;
      font-family: inherit;
      font-weight: 400;
      line-height: 1.45;
      min-height: 60px;
      max-height: 200px;
      overflow-y: auto;
      caret-color: var(--accent);
    }

    textarea::placeholder {
      color: var(--input-placeholder);
    }

    .input-footer {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 2px;
      margin-top: 10px;
    }

    .emoji-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 5px 7px;
      border-radius: 8px;
      opacity: var(--emoji-idle-opacity);
      transition: opacity 0.15s, background 0.15s;
      line-height: 1;
      display: flex;
      align-items: center;
    }

    .emoji-btn:hover {
      opacity: 0.7;
      background: var(--emoji-hover);
    }

    .emoji-btn.selected {
      opacity: 1;
      background: var(--emoji-selected);
    }

    /* ── Separator ── */
    .divider {
      border: none;
      border-top: 1px dotted var(--separator);
      margin: 16px 0 0;
    }

    /* ── Timeline ── */
    .timeline {
      padding-top: 0;
    }

    .log-entry {
      display: flex;
      align-items: flex-start;
      padding: 15px 0;
      gap: 14px;
    }

    .log-time {
      font-size: 13px;
      color: var(--muted);
      font-family: 'SF Mono', ui-monospace, 'Fira Code', 'Courier New', monospace;
      flex-shrink: 0;
      padding-top: 3px;
      letter-spacing: 0.03em;
      min-width: 38px;
    }

    .log-text {
      font-size: 16px;
      line-height: 1.55;
      color: var(--text);
      word-break: break-word;
      white-space: pre-wrap;
      flex: 1;
      min-width: 0;
    }

    .log-mood {
      font-size: 17px;
      line-height: 1.5;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .log-divider {
      border: none;
      border-top: 1px dotted var(--separator);
    }

    #archiveDayList .log-entry {
      padding: 8px 0;
    }

    #archiveDayList .log-entry + .log-entry {
      border-top: 1px dotted var(--separator);
    }

    .empty-hint {
      color: var(--placeholder);
      font-size: 14px;
      text-align: center;
      padding: 40px 0 20px;
      letter-spacing: 0.01em;
    }

    /* ── More emoji picker ── */
    .emoji-picker-wrap {
      position: relative;
    }

    .more-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      color: var(--muted);
      opacity: 0.5;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s, background 0.15s;
      font-weight: 500;
    }

    .more-btn:hover {
      opacity: 1;
      background: var(--emoji-hover);
    }

    .more-btn.open {
      opacity: 1;
      background: var(--emoji-selected);
    }

    .emoji-panel {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      right: 0;
      background: var(--bg);
      border: 1px solid var(--separator);
      border-radius: 14px;
      padding: 10px;
      z-index: 50;
      width: 196px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    }

    [data-theme="light"] .emoji-panel,
    [data-theme="snow"] .emoji-panel {
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }

    .emoji-panel.visible {
      display: block;
    }

    .emoji-panel-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 4px 6px;
    }

    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px 2px; /* row gap +4px */
    }

    /* Opens upward by default; JS flips it downward when it would reach the header buttons */
    .emoji-panel.open-down {
      bottom: auto;
      top: calc(100% + 8px);
    }

    /* Between the seasonal row and the regular rows: 12px gap + list-style divider */
    .emoji-grid .emoji-divider {
      grid-column: 1 / -1;
      height: 0;
      border-top: 1px dotted var(--separator);
      margin: 3px 0; /* + 6px grid row gaps on each side = 12px */
    }

    .emoji-grid button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      padding: 7px 4px;
      border-radius: 8px;
      line-height: 1;
      transition: background 0.12s;
    }

    .emoji-grid button:hover {
      background: var(--emoji-hover);
    }

    .emoji-grid button.selected {
      background: var(--emoji-selected);
    }

    /* ── Premium button ── */
    .premium-btn {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 16px);
      right: 112px;
      z-index: 100;
      background: var(--toggle-bg);
      border: none;
      border-radius: 20px;
      height: 36px;
      padding: 0 12px 0 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-family: inherit;
      color: var(--muted);
      letter-spacing: 0.01em;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }

    .premium-btn:hover {
      background: var(--emoji-selected);
      color: var(--text);
    }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.visible {
      display: flex;
    }

    .modal {
      background: #1A1A1A;
      border: 1px solid #2C2C2E;
      border-radius: 22px;
      padding: 36px 32px 28px;
      width: 100%;
      max-width: 340px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6);
    }

    [data-theme="light"] .modal,
    [data-theme="snow"] .modal {
      background: #FFFFFF;
      border-color: #E5E5EA;
      box-shadow: 0 16px 48px rgba(0,0,0,0.14);
    }

    .modal-brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 20px;
      line-height: 1;
    }

    .modal-price-line {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 16px;
      line-height: 1.5;
    }

    .modal-price-line strong {
      color: var(--text);
      font-weight: 600;
    }

    .modal-features {
      list-style: none;
      margin-bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-features li {
      font-size: 14px;
      color: var(--muted);
      padding-left: 16px;
      position: relative;
      line-height: 1.5;
    }

    .modal-features li::before {
      content: '•';
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .modal-cta {
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 12px;
      padding: 13px 0;
      font-size: 14px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }

    .modal-cta:hover { opacity: 0.85; }

    .modal-cta:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .modal-secondary {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      padding: 8px 0;
      width: 100%;
      transition: color 0.15s;
    }

    .modal-secondary:hover { color: var(--text); }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      padding: 8px 0;
      width: 100%;
      transition: color 0.15s;
    }

    .modal-close:hover { color: var(--text); }

    /* ── Theme picker (inside premium modal, once unlocked) ── */
    .theme-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 8px;
    }

    .theme-swatch {
      border: 2px solid var(--separator);
      border-radius: 12px;
      height: 52px;
      cursor: pointer;
      padding: 0;
      transition: border-color 0.15s, transform 0.1s;
      position: relative;
      overflow: hidden;
    }

    .theme-swatch:active { transform: scale(0.96); }

    .theme-swatch.selected {
      border-color: var(--accent);
    }

    .theme-swatch .swatch-label {
      position: absolute;
      bottom: 3px;
      left: 0;
      right: 0;
      font-size: 9px;
      letter-spacing: 0.02em;
      text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .theme-swatch[data-swatch="dark"] { background: #121212; }
    .theme-swatch[data-swatch="dark"] .swatch-label { color: #8E8E93; }
    .theme-swatch[data-swatch="light"] { background: #F2F2F7; }
    .theme-swatch[data-swatch="light"] .swatch-label { color: #6C6C70; }
    .theme-swatch[data-swatch="cyberpunk"] { background: linear-gradient(135deg, #0D0221 55%, #FF2ED1 55%, #00F0FF 100%); }
    .theme-swatch[data-swatch="cyberpunk"] .swatch-label { color: #F5F0FF; }
    .theme-swatch[data-swatch="neon"] { background: linear-gradient(135deg, #0A0A0A 55%, #39FF14 55%, #FF10F0 100%); }
    .theme-swatch[data-swatch="neon"] .swatch-label { color: #EFFFEF; }
    .theme-swatch[data-swatch="deepblue"] { background: linear-gradient(135deg, #0A1128 55%, #4361EE 55%, #4CC9F0 100%); }
    .theme-swatch[data-swatch="deepblue"] .swatch-label { color: #E8ECFB; }
    .theme-swatch[data-swatch="paper"] { background: linear-gradient(135deg, #F5EFE4 55%, #E3D8C6 55%, #B8A68E 100%); }
    .theme-swatch[data-swatch="paper"] .swatch-label { color: #6B5D4F; }
    .theme-swatch[data-swatch="xmas"] { background: linear-gradient(135deg, #0F2A1D 55%, #E63946 55%, #F4EBD9 100%); }
    .theme-swatch[data-swatch="xmas"] .swatch-label,
    .theme-swatch[data-swatch="xmas"] .swatch-badge { color: #F4EBD9; }
    .theme-swatch[data-swatch="default"] { background: linear-gradient(135deg, #121212 50%, #F2F2F7 50%); }
    .theme-swatch[data-swatch="default"] .swatch-label { color: #8E8E93; }

    .theme-locked-hint {
      font-size: 11px;
      color: var(--placeholder);
      text-align: center;
      margin-bottom: 20px;
    }

    /* ── Seasonal decorations (Snow / Christmas). Static — no animation. ── */
    /* Hat is sized/placed relative to the logo width W (% width/left and % margins all resolve against W),
       matched to the reference mock: brim resting on the top-left corner of the "n", tilted 29° left. */
    .logo-hat {
      display: none;
      position: absolute;
      width: 32.6%;
      height: auto;
      left: -6.67%;
      top: 0;
      margin-top: 12.26%;
      transform: rotate(-29deg);
      transform-origin: 50% 50%;
      pointer-events: none;
    }

    [data-theme="snow"] .logo-hat-snow,
    [data-theme="christmas"] .logo-hat-christmas {
      display: block;
    }

    .snow-bottom,
    .christmas-lights {
      display: none;
      pointer-events: none;
    }

    [data-theme="snow"] .snow-bottom {
      display: block;
      position: fixed;
      left: -8%;
      bottom: calc(-2% - 5px);
      width: 116%;
      height: auto;
      /* In front of the log so text slides behind the snow while scrolling (never drawn over it);
         below the emoji panel (50), top buttons (100) and modals (200). */
      z-index: 10;
      pointer-events: none;
      filter: drop-shadow(0 -4px 10px rgba(30,40,60,0.08));
    }

    /* Snow stays below all content: at the end of the scroll, "Copy today's log" must sit fully
       above the snow bank. Padding = full snow image height (116vw × 50/170, ignoring the -2% offset
       so it never comes up short) + 16px breathing room. */
    [data-theme="snow"] .container {
      padding-bottom: calc(116vw * 50 / 170 + 16px);
    }

    [data-theme="christmas"] .christmas-lights {
      display: block;
      position: fixed;
      left: 0;
      bottom: calc(env(safe-area-inset-bottom) - 2px);
      width: 100%;
      height: auto;
      z-index: -1;
    }

    /* Keep the last entry and "Copy today's log" clear of the lights (lights height = 100vw × 64/400, raised 3px) */
    [data-theme="christmas"] .container {
      padding-bottom: calc(100vw * 64 / 400 + 3px + 24px);
    }

    .theme-swatch .swatch-badge {
      position: absolute;
      top: 4px;
      right: 6px;
      font-size: 7px;
      font-weight: 700;
      letter-spacing: 0.06em;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .seasonal-grid {
      margin-bottom: 20px;
    }

    /* ── Recap section ── */
    .recap {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px dotted var(--separator);
    }

    .copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      font-family: inherit;
      font-weight: 400;
      padding: 0;
      text-decoration: none;
      transition: color 0.15s, text-decoration 0.15s;
      text-align: left;
    }

    .copy-btn:hover {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--muted);
    }

    .copy-btn.copied {
      color: var(--text);
    }

    /* ── Show older logs button ── */
    /* Locked "N earlier entries today" row (free users) — styled as the last list row */
    .locked-row {
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      font-family: inherit;
      align-items: center;
      gap: 6px;
      padding: 14px 0;
    }
    .locked-row-text {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
      color: var(--muted);
    }
    .locked-row-icon {
      flex-shrink: 0;
      color: var(--muted);
      display: flex;
    }
    .locked-row-icon svg {
      width: 13px;
      height: 13px;
      display: block;
    }

    /* After the locked row: 24px, then the footer's single divider */
    .recap.after-locked {
      margin-top: 24px;
    }

    /* ── Paywall ── */
    .paywall-overlay { z-index: 210; } /* above the Themes popup it can be opened from */

    /* Compact paywall. 4/8pt spacing; blocks use one-sided margins so gaps are exact. */
    .modal.paywall {
      padding: 24px;
      max-height: calc(100vh - 48px);
      max-height: calc(100dvh - 48px);
    }

    .paywall .paywall-title {
      display: flex;
      align-items: baseline;
      gap: 5px;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0;
      line-height: 1.2;
      color: var(--muted);
      margin: 0 0 20px;          /* brand → headline */
    }
    .pw-logo {
      display: inline-flex;
      align-items: baseline;
      gap: 2px;
      /* Lowercase "nu" scaled so its x-height matches the cap height of "P" in "Premium"
         (SF: cap 0.705em / x-height 0.54em ≈ 1.3) */
      font-size: 1.3em;
      line-height: 1;
    }
    .pw-logo-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--accent2);
    }

    .paywall .pw-headline {
      font-size: 22px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: -0.3px;
      color: var(--text);
      margin: 0;
    }
    .pw-subtitle {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;
      color: var(--muted);
      margin: 8px 0 0;           /* headline → subtitle */
    }

    .pw-benefits {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin: 24px 0 32px;       /* subtitle → benefits, benefits → button */
    }
    .pw-benefits li {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 400;
      line-height: 1.3;
      color: var(--text);
      white-space: nowrap;
    }
    .pw-benefits li span { opacity: 0.85; }
    .pw-benefits svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--muted);
    }

    .paywall .modal-cta {
      height: 48px;
      padding: 0 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
    }

    .pw-note {
      font-size: 13px;
      line-height: 1.3;
      color: var(--muted);
      text-align: center;
      margin: 12px 0 0;          /* button → note */
    }

    /* Each link gets a ~41px tall touch area; margins offset its padding so visual gaps stay 32px / 24px */
    .pw-links {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      line-height: 1;
      color: var(--muted);
      opacity: 0.7;
      margin: 18px 0 -14px;      /* 18 + 14px link padding = 32px visual gap; -14 keeps 24px bottom */
    }
    .pw-link {
      background: none;
      border: none;
      color: inherit;
      font-size: 13px;
      font-family: inherit;
      line-height: 1;
      cursor: pointer;
      padding: 14px 10px;
      transition: color 0.15s;
    }
    .pw-link:hover { color: var(--text); }

    /* Lock on premium swatches in the Themes popup (free users) */
    .theme-swatch .swatch-lock {
      display: none;
      position: absolute;
      top: 4px;
      right: 6px;
      width: 11px;
      height: 11px;
      color: rgba(255, 255, 255, 0.85);
    }
    .theme-swatch[data-swatch="paper"] .swatch-lock { color: #6B5D4F; }
    .theme-swatch .swatch-lock svg { width: 100%; height: 100%; display: block; }
    .themes-locked .theme-swatch[data-premium] .swatch-lock { display: block; }

    .modal-context {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      margin-bottom: 8px;
    }

    .show-older-btn {
      display: block;
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--placeholder);
      font-size: 13px;
      font-family: inherit;
      font-weight: 400;
      padding: 14px 0;
      text-align: left;
      transition: color 0.15s;
      letter-spacing: 0.01em;
    }

    .show-older-btn:hover {
      color: var(--muted);
    }

    /* ── Archive (history) calendar ── */
    #archiveOverlay .modal {
      background: var(--surface);
      border-color: var(--surface-border);
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .cal-nav-btn {
      background: var(--toggle-bg);
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 15px;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .cal-nav-btn:hover { background: var(--emoji-selected); }
    .cal-nav-btn:disabled { opacity: 0.3; cursor: default; }

    .cal-month-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 4px;
    }

    .cal-weekdays span {
      text-align: center;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-bottom: 16px;
    }

    .cal-day {
      background: none;
      border: none;
      border-radius: 9px;
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--text);
      font-family: inherit;
      cursor: pointer;
      position: relative;
      transition: background 0.15s;
    }

    .cal-day:hover:not(:disabled) { background: var(--emoji-hover); }
    .cal-day:disabled { color: var(--placeholder); cursor: default; opacity: 0.35; }

    .cal-day .cal-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--marker);
      margin-top: 2px;
    }

    .cal-day.today {
      box-shadow: inset 0 0 0 1.5px var(--muted);
    }

    .cal-day.selected {
      background: var(--emoji-selected);
      color: var(--accent2);
      font-weight: 700;
    }

    .archive-day-btn {
      background: none;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      padding: 12px 10px;
      font-size: 14px;
      color: var(--text);
      font-family: inherit;
      transition: background 0.15s;
    }

    .archive-day-btn:hover {
      background: var(--emoji-hover);
    }

    .archive-day-btn .archive-count {
      color: var(--muted);
      font-size: 12px;
      margin-left: 6px;
    }

    .archive-empty {
      color: var(--placeholder);
      font-size: 13px;
      padding: 12px 0 20px;
    }

    .archive-back-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      padding: 0 0 16px;
      transition: color 0.15s;
    }

    .archive-back-btn:hover { color: var(--text); }

    /* Scrollbar */
    textarea::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle dark/light mode"></button>
  <button class="history-btn" id="historyBtn" aria-label="Past days" title="History">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4" width="14" height="13" rx="2.5"/>
      <line x1="3" y1="8" x2="17" y2="8"/>
      <line x1="7" y1="2" x2="7" y2="5"/>
      <line x1="13" y1="2" x2="13" y2="5"/>
    </svg>
  </button>
  <button class="premium-btn" id="premiumBtn" aria-label="Premium features"></button>

  <!-- Premium Modal -->
  <!-- Themes popup (everyone). Premium themes are locked for free users and open the paywall. -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-label="Themes">
    <div class="modal">
      <div class="modal-brand" id="premiumTitle">Themes</div>
      <div id="premiumUnlocked">
        <div class="modal-price-line" id="themesSubtitle">Pick a theme:</div>
        <div class="theme-grid" id="themeGrid">
          <button class="theme-swatch" data-swatch="xmas" data-seasonal aria-label="Christmas theme" style="display:none"><span class="swatch-label">Christmas</span><span class="swatch-badge">FREE</span></button>
          <button class="theme-swatch" data-swatch="default" data-seasonal aria-label="Default theme" style="display:none"><span class="swatch-label">Default</span></button>
          <button class="theme-swatch" data-swatch="dark" data-offseason aria-label="Dark theme"><span class="swatch-label">Dark</span></button>
          <button class="theme-swatch" data-swatch="light" data-offseason aria-label="Light theme"><span class="swatch-label">Light</span></button>
          <button class="theme-swatch" data-swatch="cyberpunk" data-premium aria-label="Cyberpunk theme"><span class="swatch-label">Cyberpunk</span><span class="swatch-lock" aria-hidden="true"></span></button>
          <button class="theme-swatch" data-swatch="neon" data-premium aria-label="Neon theme"><span class="swatch-label">Neon</span><span class="swatch-lock" aria-hidden="true"></span></button>
          <button class="theme-swatch" data-swatch="deepblue" data-premium aria-label="Deep Blue theme"><span class="swatch-label">Deep Blue</span><span class="swatch-lock" aria-hidden="true"></span></button>
          <button class="theme-swatch" data-swatch="paper" data-premium aria-label="Paper theme"><span class="swatch-label">Paper</span><span class="swatch-lock" aria-hidden="true"></span></button>
        </div>
        <div class="modal-actions">
          <button class="modal-close" id="closeModalBtn2">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Premium paywall -->
  <div class="modal-overlay paywall-overlay" id="paywallOverlay" role="dialog" aria-modal="true" aria-label="nu. Premium">
    <div class="modal paywall">
      <div class="modal-brand paywall-title"><span class="pw-logo">nu<span class="pw-logo-dot"></span></span> Premium</div>
      <div class="pw-headline" id="paywallHeadline"></div>
      <p class="pw-subtitle" id="paywallSubtitle"></p>
      <ul class="pw-benefits" id="paywallBenefits"></ul>
      <button class="modal-cta" id="unlockBtn" disabled>Unlock Premium</button>
      <p class="pw-note">One-time payment. No subscription, ever.</p>
      <div class="pw-links">
        <button class="pw-link" id="restoreBtn">Restore Purchases</button>
        <span class="pw-sep" aria-hidden="true">·</span>
        <button class="pw-link" id="closePaywallBtn">Close</button>
      </div>
    </div>
  </div>

  <!-- Archive Modal -->
  <div class="modal-overlay" id="archiveOverlay" role="dialog" aria-modal="true" aria-label="nu. History">
    <div class="modal">
      <div class="modal-brand">History</div>

      <div id="archiveLocked">
        <div class="modal-price-line">Viewing past days is a premium feature.</div>
        <div class="modal-actions">
          <button class="modal-cta" id="archiveUnlockBtn">Unlock Premium</button>
          <button class="modal-close" id="closeArchiveBtn">Close</button>
        </div>
      </div>

      <div id="archiveUnlocked" style="display:none">
        <div id="calView">
          <div class="cal-header">
            <button class="cal-nav-btn" id="calPrevBtn" aria-label="Previous month">‹</button>
            <div class="cal-month-label" id="calMonthLabel"></div>
            <button class="cal-nav-btn" id="calNextBtn" aria-label="Next month">›</button>
          </div>
          <div class="cal-weekdays">
            <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <div id="archiveDayList"></div>
        <div class="modal-actions">
          <button class="modal-close" id="closeArchiveBtn2">Close</button>
        </div>
      </div>
    </div>
  </div>

  <img class="snow-bottom" src="seasonal/snow-bottom.svg" alt="">
  <img class="christmas-lights" src="seasonal/christmas-lights.svg" alt="">

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="day-block">
        <span class="day-text">nu</span>
        <span class="day-dot"></span>
        <img class="logo-hat logo-hat-snow" src="seasonal/santa-hat-snow.svg" alt="">
        <img class="logo-hat logo-hat-christmas" src="seasonal/santa-hat-christmas.svg" alt="">
      </div>
      <div class="date-block" id="dateText"></div>
    </div>

    <!-- Input -->
    <div class="input-section">
      <textarea
        id="journalInput"
        placeholder="What did you just finish? What is the next tiny step?"
        rows="3"
        spellcheck="true"
        autocomplete="off"
      ></textarea>
      <div class="input-footer">
        <button class="emoji-btn" data-emoji="🙂" aria-label="Good">🙂</button>
        <button class="emoji-btn" data-emoji="😐" aria-label="Neutral">😐</button>
        <button class="emoji-btn" data-emoji="😫" aria-label="Tired">😫</button>
        <div class="emoji-picker-wrap">
          <button class="more-btn" id="moreBtn" aria-label="More emojis" title="More emojis">+</button>
          <div class="emoji-panel" id="emojiPanel" role="dialog" aria-label="Emoji picker">
            <div class="emoji-grid" id="emojiGrid"></div>
          </div>
        </div>
      </div>
    </div>

    <hr class="divider">

    <!-- Timeline -->
    <div class="timeline" id="timeline" role="list" aria-label="Journal entries"></div>

    <!-- Recap -->
    <div class="recap" id="recap" style="display:none">
      <button class="copy-btn" id="copyBtn">Copy today's log</button>
    </div>
  </div>

  <script src="bundle.js"></script>
</body>
</html>
